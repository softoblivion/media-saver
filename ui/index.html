<!doctype html>
<html lang="en" data-theme="dusk" data-mode="instagram" data-format="mp4">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Saver</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <!-- The saved theme before the first paint: js/main.js writes the confirmed Settings.theme to this key. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('media-saver.theme');
        if (t === 'dusk' || t === 'nova' || t === 'frost' || t === 'bloom') document.documentElement.dataset.theme = t;
      } catch (e) { /* storage unavailable: the default theme stays */ }
    })();
  </script>
  <!-- Liquid UI design kit: a vendored copy (vendor/liquid_ui/VENDORED.txt); fonts are named in its tokens.css only. -->
  <link rel="stylesheet" href="vendor/liquid_ui/css/tokens.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/themes.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/base.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/scene.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/glass.css">
  <link rel="stylesheet" href="vendor/liquid_ui/css/components.css">
  <!-- Media Saver: layout tokens, its own components, the screen. -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/parts.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Scene behind everything: the kit's background in the theme's colours, thumbnail ghosts (js/scene.js). -->
  <div id="scene" aria-hidden="true"></div>

  <!-- Shared SVG filters of the lenses (js/glass.js appends one <filter> per surface). -->
  <svg id="lg-defs" aria-hidden="true" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden"><defs></defs></svg>

  <div id="app">
    <header id="titlebar">
      <div class="tb-drag pywebview-drag-region"></div>
      <!-- Three columns (1fr auto 1fr): brand + version pill, the mode switch centred in the window, the right cluster. -->
      <div class="tb-brand">
        <span id="tb-glyph" class="tb-glyph"></span>
        <span class="tb-name pywebview-drag-region">Media Saver</span>
        <button type="button" id="ver-pill" class="ver-pill" aria-haspopup="dialog"><span class="ver-dot" aria-hidden="true"></span><span class="ver-text"></span></button>
      </div>
      <!-- Mode switch (Instagram / YouTube / TikTok / X as icons), js/main.js -->
      <div id="mode-slot" class="tb-mode"></div>
      <div class="tb-right">
        <button type="button" id="engine-chip" class="eng-chip" aria-haspopup="dialog"></button>
        <button type="button" id="btn-settings" class="round-lens" aria-label="Settings" aria-haspopup="dialog"></button>
        <div class="win-btns">
          <button type="button" id="win-min" class="win-btn" aria-label="Minimize"></button>
          <button type="button" id="win-close" class="win-btn win-close" aria-label="Close"></button>
        </div>
      </div>
    </header>

    <main id="main">
      <section id="composer" class="composer" aria-label="Links to download">
        <div class="cmp-head">
          <h2 class="cmp-title">Links</h2>
          <div id="counters" class="counters" aria-live="polite">
            <span class="counter c-valid" data-c="valid" hidden><b>0</b><span>ready</span></span>
            <span class="counter c-invalid" data-c="invalid" hidden><b>0</b><span>invalid</span></span>
            <span class="counter c-dup" data-c="dup" hidden><b>0</b><span>duplicates</span></span>
            <span class="counter c-other" data-c="other" hidden><b>0</b><span>other</span></span>
          </div>
        </div>

        <div class="cmp-well">
          <textarea id="links-input" class="cmp-input" spellcheck="false" autocomplete="off" aria-label="Links"></textarea>
          <div class="cmp-drop" aria-hidden="true"><span>Drop to add links</span></div>
        </div>

        <div class="cmp-tools">
          <button type="button" class="btn btn-s" data-tool="paste"><span class="ic-slot" data-icon="paste"></span><span>Paste</span></button>
          <button type="button" class="btn btn-s" data-tool="clean"><span class="ic-slot" data-icon="sparkle"></span><span>Clean links</span></button>
          <button type="button" class="btn btn-s" data-tool="copy"><span class="ic-slot" data-icon="copy"></span><span>Copy clean links</span></button>
        </div>

        <div id="preview" class="cmp-preview is-empty">
          <div class="pv-list"></div>
          <div class="pv-more" hidden></div>
          <div class="pv-hint">
            <span class="pv-hint-art" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="pv-hint-text"></span>
          </div>
        </div>

        <!-- "What you get": video quality of the current mode (js/quality.js), above format + Download. -->
        <div id="cmp-spec" class="cmp-spec">
          <span class="spec-label" aria-hidden="true">Quality</span>
          <div id="quality-slot"></div>
          <span class="spec-hint"></span>
        </div>

        <div class="cmp-action">
          <div id="format-slot"></div>
          <div class="cmp-btn-slot">
            <button type="button" id="btn-download" class="hero" data-state="empty"></button>
          </div>
        </div>
      </section>

      <section id="queue" class="queue" aria-label="Download queue">
        <div id="q-scroll" class="q-scroll">
          <div id="q-list" class="q-list" role="list"></div>
          <div id="q-empty" class="q-empty" hidden></div>
        </div>
        <div id="q-head" class="q-head">
          <div class="q-title-wrap">
            <h2 class="q-title">Queue</h2>
            <div id="q-counts" class="q-counts"></div>
          </div>
          <div class="q-actions">
            <button type="button" id="btn-clear" class="btn btn-s btn-ghost" aria-label="Clear finished" title="Remove finished items from the list (files stay on disk)"><span class="ic-slot" data-icon="trash"></span><span>Clear finished</span></button>
            <!-- Split button: open the downloads folder, or pick another one from the chevron menu (js/queue.js). -->
            <div id="folder-split" class="split">
              <button type="button" id="btn-folder" class="btn btn-s split-main" aria-label="Open folder"><span class="ic-slot" data-icon="folder"></span><span>Open folder</span></button>
              <button type="button" id="btn-folder-more" class="btn btn-s split-more" aria-label="Downloads folder options" title="Choose where videos are saved" aria-haspopup="menu" aria-expanded="false" aria-controls="folder-menu"><span class="ic-slot" data-icon="chevronDown"></span></button>
            </div>
          </div>
          <div id="folder-menu" class="split-menu glass-lite" role="menu" aria-label="Downloads folder" hidden>
            <div class="fm-where" aria-hidden="true"><span>Saving to</span><b class="fm-path"></b></div>
            <button type="button" class="fm-item" role="menuitem" data-act="open"><span class="ic-slot" data-icon="folder"></span><span>Open folder</span></button>
            <button type="button" class="fm-item" role="menuitem" data-act="change"><span class="ic-slot" data-icon="folderEdit"></span><span>Change folder…</span></button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Overlays: sheets and popovers grow out of the control that opened them (js/overlay.js). -->
  <div id="engine-pop" class="popover" role="dialog" aria-label="Download engine"><div class="ov-content"></div></div>
  <div id="update-pop" class="popover pop-wide" role="dialog" aria-label="Media Saver updates"><div class="ov-content"></div></div>
  <div id="settings-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="ov-content"></div></div>

  <div id="clip-pill" class="clip-pill" role="status"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
