name: Bug report
description: Something does not work as documented
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the version pill of the window or in the file properties of the exe.
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead; an error text as shown.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last lines of `media-saver_data\logs\app.log` next to `MediaSaver.exe`, if relevant; for a failed download also `logs\jobs\<job id>.log`.
      render: text
