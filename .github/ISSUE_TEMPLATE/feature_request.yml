name: Feature request
description: Something the app should do
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How the app could do it
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
